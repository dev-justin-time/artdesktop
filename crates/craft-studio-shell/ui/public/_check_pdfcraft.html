<!doctype html><html><head><title>pending</title></head><body>
<iframe id="f" src="/pages/pdfcraft/index.html" style="width:1400px;height:900px;border:0"></iframe>
<script>
const f = document.getElementById("f");
f.addEventListener("load", () => {
  const d = f.contentDocument;
  const style = d.createElement("style");
  style.textContent = "body > header, body > aside { display:none !important; } main { padding-top:0 !important; }";
  d.head.appendChild(style);
  Promise.all([
    d.fonts.ready,
    new Promise(r => setTimeout(r, 1500))
  ]).then(() => {
    const imgs = [...d.images];
    const broken = imgs.filter(i => !i.complete || i.naturalWidth === 0);
    document.title = JSON.stringify({
      inter: d.fonts.check('16px "Inter"'),
      geist: d.fonts.check('16px "Geist"'),
      mono: d.fonts.check('16px "JetBrains Mono"'),
      icons: d.fonts.check('24px "Material Symbols Outlined"'),
      images: imgs.length,
      broken: broken.length,
      headerHidden: getComputedStyle(d.querySelector("body > header")).display,
      innerAsides: [...d.querySelectorAll("aside")].filter(a => getComputedStyle(a).display !== "none").length
    });
  });
});
</script></body></html>
