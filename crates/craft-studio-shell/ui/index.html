<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArtCraft Studio</title>
</head>
<body class="h-screen flex flex-col bg-gray-900 text-gray-200 overflow-hidden">
  <header class="h-14 bg-gray-950 border-b border-gray-800 flex items-center px-4 gap-4 shrink-0">
    <div class="flex gap-2" id="module-tabs"></div>
    <div class="h-6 w-px bg-gray-700"></div>
    <div class="flex gap-1 overflow-x-auto" id="dynamic-toolbar">
      <span class="text-gray-500 text-sm italic">Select a module</span>
    </div>
    <button id="expert-toggle" type="button" class="ml-auto shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-gray-700 bg-gray-900 text-gray-200 text-xs font-semibold hover:border-cyan-400 hover:text-cyan-300 transition-colors" aria-label="Open Suite Expert">
      <span aria-hidden="true">✦</span> Suite Expert
    </button>
  </header>

  <div class="flex-1 flex overflow-hidden">
    <aside class="w-64 bg-gray-900 border-r border-gray-800 flex flex-col shrink-0">
      <div class="p-3 border-b border-gray-800 text-xs font-bold uppercase text-gray-500">Shared Clipboard</div>
      <div class="flex-1 p-4 flex flex-col items-center justify-center" id="clipboard-preview">
        <span class="text-gray-600 text-sm italic">Empty</span>
      </div>
    </aside>

    <main class="flex-1 bg-gray-800 flex items-center justify-center relative" id="canvas-workspace">
      <h2 class="text-4xl text-gray-600 font-bold">Select a Module to Begin</h2>
    </main>

    <aside id="expert-panel" class="hidden w-[380px] shrink-0 bg-gray-950 border-l border-gray-800 flex-col" aria-label="Suite Expert">
      <div class="h-12 px-4 flex items-center justify-between border-b border-gray-800 shrink-0">
        <div class="flex items-center gap-2">
          <span class="text-sm font-semibold text-gray-100">Suite Expert</span>
          <span class="text-[10px] font-mono uppercase tracking-wider text-cyan-300 bg-cyan-950/60 border border-cyan-900 rounded px-1.5 py-0.5">Offline</span>
        </div>
        <button id="expert-close" type="button" class="p-1 rounded text-gray-500 hover:text-gray-100 hover:bg-gray-800" aria-label="Close Suite Expert">✕</button>
      </div>
      <div id="expert-messages" class="flex-1 overflow-y-auto p-4 space-y-3 text-sm" aria-live="polite" aria-relevant="additions"></div>
      <div id="expert-suggestions" class="px-4 pb-2 flex flex-wrap gap-2"></div>
      <form id="expert-form" class="p-3 border-t border-gray-800 flex gap-2 shrink-0">
        <label class="sr-only" for="expert-input">Ask about an ArtCraft app</label>
        <input id="expert-input" type="text" autocomplete="off" placeholder="Ask about any of the ten apps…" class="flex-1 min-w-0 bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 placeholder:text-gray-600 focus:outline-none focus:border-cyan-500">
        <button id="expert-send" type="submit" class="px-3 py-2 rounded-lg bg-cyan-500 text-gray-950 text-sm font-semibold hover:bg-cyan-400 disabled:opacity-50 disabled:cursor-wait">Ask</button>
      </form>
    </aside>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
