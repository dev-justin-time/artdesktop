name: ArtCraft Studio CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: crates/craft-studio-shell/ui/package-lock.json

    - name: Cache Embedded Apps
      uses: actions/cache@v4
      with:
        path: crates/craft-studio-shell/ui/public/apps
        key: web-apps-${{ hashFiles('crates/craft-studio-shell/ui/web-apps.json') }}

    - name: Install Tauri System Dependencies (Linux)
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
          libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

    - name: Install Frontend Dependencies
      run: npm ci
      working-directory: crates/craft-studio-shell/ui

    - name: Audit Frontend Dependencies
      working-directory: crates/craft-studio-shell/ui
      shell: bash
      # A vulnerable tree fails the build. A registry that cannot be reached does
      # not: the audit needs the network, and an outage is not a finding.
      run: |
        set +e
        npm audit --audit-level=high > npm-audit.log 2>&1
        status=$?
        cat npm-audit.log
        set -e
        if [ "$status" -eq 0 ]; then
          exit 0
        fi
        if grep -qiE 'ENOTFOUND|ETIMEDOUT|ECONNREFUSED|ECONNRESET|EAI_AGAIN|network|registry (error|request)|50[234]' npm-audit.log; then
          echo "::warning::npm audit could not reach the registry; the gate was skipped for this run"
          exit 0
        fi
        exit "$status"

    - name: Build Frontend (Vite)
      run: npm run build
      working-directory: crates/craft-studio-shell/ui

    - name: Check Documentation and Discovery Artifacts
      run: |
        node scripts/generate-docs.mjs --check
        node scripts/generate-seo.mjs --check

    - name: Test MCP Server
      run: node scripts/check-mcp.mjs

    - name: Test Suite Expert Ranking
      run: npm run test:expert
      working-directory: crates/craft-studio-shell/ui

    - name: Check Rust Formatting
      run: cargo fmt --all -- --check

    - name: Run Clippy (Linting)
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Install cargo-audit
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-audit

    - name: Audit Rust Dependencies
      run: cargo audit

    - name: Run Workspace Tests
      run: cargo test --workspace

    - name: Track glib Advisory Exception
      run: node scripts/check-glib-advisory.mjs

    - name: Build Full Release Binary
      run: cargo build --release --workspace

  build-windows-installer:
    name: Build Windows Installers (NSIS + MSI)
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: crates/craft-studio-shell/ui/package-lock.json

    - name: Cache Embedded Apps
      uses: actions/cache@v4
      with:
        path: crates/craft-studio-shell/ui/public/apps
        key: web-apps-${{ hashFiles('crates/craft-studio-shell/ui/web-apps.json') }}

    - name: Install Frontend Dependencies
      run: npm ci
      working-directory: crates/craft-studio-shell/ui

    - name: Build NSIS and MSI Installers
      run: npx --yes "@tauri-apps/cli@^2" build --bundles nsis,msi
      working-directory: crates/craft-studio-shell

    - name: Upload NSIS Installer
      uses: actions/upload-artifact@v4
      with:
        name: artcraft-studio-nsis
        path: target/release/bundle/nsis/*.exe
        if-no-files-found: error
        retention-days: 14

    - name: Upload MSI Installer
      uses: actions/upload-artifact@v4
      with:
        name: artcraft-studio-msi
        path: target/release/bundle/msi/*.msi
        if-no-files-found: error
        retention-days: 14
